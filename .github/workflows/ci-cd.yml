name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CLDV6212_CoffeeNChill_Functions.slnx

      - name: Build
        run: dotnet build CLDV6212_CoffeeNChill_Functions.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test CLDV6212_CoffeeNChill_Functions.slnx --configuration Release --no-build --verbosity normal

  docker-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Functions image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/coffeenchill-ice4-functions:1.0.${{ github.run_number }}
            ${{ secrets.DOCKERHUB_USERNAME }}/coffeenchill-ice4-functions:latest

      - name: Build and push Azurite image
        uses: docker/build-push-action@v6
        with:
          context: ./azurite
          file: ./azurite/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/coffeenchill-ice4-azurite:1.0.${{ github.run_number }}
            ${{ secrets.DOCKERHUB_USERNAME }}/coffeenchill-ice4-azurite:latest

  deploy:
    runs-on: ubuntu-latest
    needs: docker-push
    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/coffeenchill
            docker-compose pull && docker-compose up -d
